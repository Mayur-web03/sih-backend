        'option'
    );

allOption.value = 'all';

allOption.textContent =
    'All hops';

hopFilter.appendChild(
    allOption
);


// ------------------------------------------------------------
// Dynamic hop filters
// ------------------------------------------------------------

DATA.hops.forEach(hop => {

    const option =
        document.createElement(
            'option'
        );

    option.value =
        String(hop);

    option.textContent =
        `Hop ${hop}`;

    hopFilter.appendChild(
        option
    );

});


const info =
    document.getElementById(
        'info'
    );


// ------------------------------------------------------------
// NODE INFORMATION
// ------------------------------------------------------------

function showNodeInfo(id) {

    const outgoing =
        DATA.edges.filter(
            e => e.from === id
        ).length;

    const incoming =
        DATA.edges.filter(
            e => e.to === id
        ).length;

    info.style.display =
        'block';

    info.innerHTML =

        `<b>Wallet / Contract</b><br>` +

        `${id}<br><br>` +

        `<span style="color:#94a3b8">` +

        `Outgoing transactions: ${outgoing}<br>` +

        `Incoming transactions: ${incoming}` +

        `</span>`;

}


// ------------------------------------------------------------
// CLICK HANDLER
// ------------------------------------------------------------

network.on(
    'click',
    params => {

        if (
            params.nodes.length
        ) {

            showNodeInfo(
                params.nodes[0]
            );

        }

        else if (
            params.edges.length
        ) {

            const e =
                edges.get(
                    params.edges[0]
                );

            info.style.display =
                'block';

            info.innerHTML =
                e.title;

        }

        else {

            info.style.display =
                'none';

        }

    }
);


// ------------------------------------------------------------
// FIT
// ------------------------------------------------------------

document.getElementById(
    'fit'
).onclick = () =>

    network.fit({
        animation:{
            duration:500
        }
    });


// ------------------------------------------------------------
// FOCUS START
// ------------------------------------------------------------

document.getElementById(
    'focusSeed'
).onclick = () => {

    network.selectNodes([
        DATA.seed
    ]);

    network.focus(
        DATA.seed,
        {
            scale:1.5,
            animation:{
                duration:500
            }
        }
    );

    showNodeInfo(
        DATA.seed
    );

};


// ------------------------------------------------------------
// RESET
// ------------------------------------------------------------

document.getElementById(
    'reset'
).onclick = () => {

    DATA.edges.forEach(
        e => edges.update({
            id:e.id,
            hidden:false
        })
    );

    hopFilter.value =
        'all';

    network.fit({
        animation:{
            duration:500
        }
    });

    info.style.display =
        'none';

};


// ------------------------------------------------------------
// PHYSICS
// ------------------------------------------------------------

let physicsOn = true;

document.getElementById(
    'physics'
).onclick = () => {

    physicsOn =
        !physicsOn;

    network.setOptions({
        physics:{
            enabled:physicsOn
        }
    });

};


// ------------------------------------------------------------
// LABELS
// ------------------------------------------------------------

let labelsOn = true;

document.getElementById(
    'labels'
).onclick = () => {

    labelsOn =
        !labelsOn;

    DATA.edges.forEach(
        e => edges.update({

            id:e.id,

            label:
                labelsOn
                ? e.label
                : ''

        })
    );

};


// ------------------------------------------------------------
// HOP FILTER
// ------------------------------------------------------------

hopFilter.addEventListener(
    'change',
    e => {

        const selected =
            e.target.value;

        DATA.edges.forEach(
            edge => {

                edges.update({

                    id:edge.id,

                    hidden:
                        selected !== 'all'
                        &&
                        String(edge.hop)
                        !== selected

                });

            }
        );

    }
);


// ------------------------------------------------------------
// SEARCH
// ------------------------------------------------------------

document.getElementById(
    'search'
).addEventListener(
    'keydown',
    e => {

        if (
            e.key !== 'Enter'
        )
            return;

        const q =
            e.target.value
            .trim()
            .toLowerCase();

        if (!q)
            return;


        // Search wallet
        const node =
            DATA.nodes.find(
                n =>
                    n.id
                    .toLowerCase()
                    .includes(q)
            );


        if (node) {

            network.selectNodes([
                node.id
            ]);

            network.focus(
                node.id,
                {
                    scale:1.5,
                    animation:{
                        duration:500
                    }
                }
            );

            showNodeInfo(
                node.id
            );

            return;

        }


        // Search transaction
        const edge =
            DATA.edges.find(
                x =>
                    x.title
                    .toLowerCase()
                    .includes(q)
            );


        if (edge) {

            network.selectEdges([
                edge.id
            ]);

            network.focus(
                edge.from,
                {
                    scale:1.3,
                    animation:{
                        duration:500
                    }
                }
            );

            info.style.display =
                'block';

            info.innerHTML =
                edge.title;

            return;

        }


        alert(
            'No matching address or transaction hash found.'
        );

    }
);

</script>

</body>

</html>
