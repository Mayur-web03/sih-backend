e64c1a9f3bae2bf4ec689c05fba798009856605fb4c30c55e8f16326b22a7<br><b>Block:<\/b> 11665650<br><br><b>From:<\/b> 0x846943093f519a47734765bef9ee1136800beb9c<br><b>To:<\/b> 0x0ec72ac1f37f2b6e9182a9d4d3d062594773063c<br><b>Value:<\/b> 0 ETH<br><b>Gas used:<\/b> 34972<br><b>Gas price:<\/b> 2553368584", "hop": 1}], "seed": "0x846943093f519a47734765bef9ee1136800beb9c", "total_rows": 168, "valid_edges": 168, "unique_addresses": 107, "unique_txs": 168, "hops": [1, 2, 3, 4, 5]};


const nodes = new vis.DataSet(
    DATA.nodes
);


const edges = new vis.DataSet(
    DATA.edges
);


const network = new vis.Network(

    document.getElementById(
        'network'
    ),

    {
        nodes,
        edges
    },

    {

        autoResize:true,

        interaction:{

            hover:true,

            navigationButtons:true,

            keyboard:true,

            multiselect:false

        },

        physics:{

            enabled:true,

            stabilization:{
                iterations:350
            },

            barnesHut:{

                gravitationalConstant:-7000,

                centralGravity:0.12,

                springLength:170,

                springConstant:0.035,

                damping:0.82

            }

        },

        nodes:{

            shape:'dot',

            font:{
                size:10,
                color:'#111827'
            },

            color:{

                background:'#ffffff',

                border:'#334155',

                highlight:{
                    background:'#dbeafe',
                    border:'#2563eb'
                }

            }

        },

        edges:{

            smooth:{
                type:'dynamic'
            },

            color:{

                color:'#94a3b8',

                highlight:'#2563eb'

            },

            font:{

                size:9,

                color:'#334155',

                strokeWidth:3,

                strokeColor:'#f8fafc'

            }

        }

    }

);


document.getElementById(
    'stats'
).textContent =

    `${DATA.total_rows} collected rows · ` +

    `${DATA.unique_txs} unique transactions · ` +

    `${DATA.unique_addresses} addresses · ` +

    `${DATA.valid_edges} transaction edges · ` +

    `${DATA.hops.length} hop levels`;


const hopFilter =
    document.getElementById(
        'hopFilter'
    );


const allOption =
    document.createElement(
        'option'
    );

allOption.value = 'all';

allOption.textContent =
    'All hops';

hopFilter.appendChild(
    allOption
);


// ------------------------------------------------------------
// Dynamic hop filters
// ------------------------------------------------------------

DATA.hops.forEach(hop => {

    const option =
        document.createElement(
            'option'
        );

    option.value =
        String(hop);

    option.textContent =
        `Hop ${hop}`;

    hopFilter.appendChild(
        option
    );

});


const info =
    document.getElementById(
        'info'
    );


// ------------------------------------------------------------
// NODE INFORMATION
// ------------------------------------------------------------

function showNodeInfo(id) {

    const outgoing =
        DATA.edges.filter(
            e => e.from === id
        ).length;

    const incoming =
        DATA.edges.filter(
            e => e.to === id
        ).length;

    info.style.display =
        'block';

    info.innerHTML =

        `<b>Wallet / Contract</b><br>` +

        `${id}<br><br>` +

        `<span style="color:#94a3b8">` +

        `Outgoing transactions: ${outgoing}<br>` +

        `Incoming transactions: ${incoming}` +

        `</span>`;

}


// ------------------------------------------------------------
// CLICK HANDLER
// ------------------------------------------------------------

network.on(
    'click',
    params => {

        if (
            params.nodes.length
        ) {

            showNodeInfo(
                params.nodes[0]
            );

        }

        else if (
            params.edges.length
        ) {

            const e =
                edges.get(
                    params.edges[0]
                );

            info.style.display =
                'block';

            info.innerHTML =
                e.title;

        }

        else {

            info.style.display =
                'none';

        }

    }
);


// ------------------------------------------------------------
// FIT
// ------------------------------------------------------------

document.getElementById(
    'fit'
).onclick = () =>

    network.fit({
        animation:{
            duration:500
        }
    });


// ------------------------------------------------------------
// FOCUS START
// ------------------------------------------------------------

document.getElementById(
    'focusSeed'
).onclick = () => {

    network.selectNodes([
        DATA.seed
    ]);

    network.focus(
        DATA.seed,
        {
            scale:1.5,
            animation:{
                duration:500
            }
        }
    );

    showNodeInfo(
        DATA.seed
    );

};


// ------------------------------------------------------------
// RESET
// ------------------------------------------------------------

document.getElementById(
    'reset'
).onclick = () => {

    DATA.edges.forEach(
        e => edges.update({
            id:e.id,
            hidden:false
        })
    );

    hopFilter.value =
        'all';

    network.fit({
        animation:{
            duration:500
        }
    });

    info.style.display =
        'none';

};


// ------------------------------------------------------------
// PHYSICS
// ------------------------------------------------------------

let physicsOn = true;

document.getElementById(
    'physics'
).onclick = () => {

    physicsOn =
        !physicsOn;

    network.setOptions({
        physics:{
            enabled:physicsOn
        }
    });

};


// ------------------------------------------------------------
// LABELS
// ------------------------------------------------------------

let labelsOn = true;

document.getElementById(
    'labels'
).onclick = () => {

    labelsOn =
        !labelsOn;

    DATA.edges.forEach(
        e => edges.update({

            id:e.id,

            label:
                labelsOn
                ? e.label
                : ''

        })
    );

};


// ------------------------------------------------------------
// HOP FILTER
// ------------------------------------------------------------

hopFilter.addEventListener(
    'change',
    e => {

        const selected =
            e.target.value;

        DATA.edges.forEach(
            edge => {

                edges.update({

                    id:edge.id,

                    hidden:
                        selected !== 'all'
                        &&
                        String(edge.hop)
                        !== selected

                });

            }
        );

    }
);


// ------------------------------------------------------------
// SEARCH
// ------------------------------------------------------------

document.getElementById(
    'search'
).addEventListener(
    'keydown',
    e => {

        if (
            e.key !== 'Enter'
        )
            return;

        const q =
            e.target.value
            .trim()
            .toLowerCase();

        if (!q)
            return;


        // Search wallet
        const node =
            DATA.nodes.find(
                n =>
                    n.id
                    .toLowerCase()
                    .includes(q)
            );


        if (node) {

            network.selectNodes([
                node.id
            ]);

            network.focus(
                node.id,
                {
                    scale:1.5,
                    animation:{
                        duration:500
                    }
                }
            );

            showNodeInfo(
                node.id
            );

            return;

        }


        // Search transaction
        const edge =
            DATA.edges.find(
                x =>
                    x.title
                    .toLowerCase()
                    .includes(q)
            );


        if (edge) {

            network.selectEdges([
                edge.id
            ]);

            network.focus(
                edge.from,
                {
                    scale:1.3,
                    animation:{
                        duration:500
                    }
                }
            );

            info.style.display =
                'block';

            info.innerHTML =
                edge.title;

            return;

        }


        alert(
            'No matching address or transaction hash found.'
        );

    }
);

</script>

</body>

</html>
